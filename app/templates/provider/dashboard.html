{% extends "base.html" %}

{% block title %}Provider Dashboard | Appointment Booking{% endblock %}

{% block content %}
<h1 class="h3 mb-1">Provider Dashboard</h1>
<p class="text-muted">Signed in as {{ current_user.name }}.</p>

<div class="row g-3">
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h2 class="h5">Availability</h2>
        <p class="text-muted">Set your working days, hours, appointment length and blocked time.</p>
        <a class="btn btn-primary" href="{{ url_for('provider.availability') }}">Manage availability</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
